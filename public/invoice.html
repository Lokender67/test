<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Invoice</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #1c1c1a; background: #f2f2ef; margin: 0; padding: 24px 16px; }
    .sheet { background: #fff; max-width: 800px; margin: 0 auto; padding: 40px; border: 1px solid #e4e4df; border-radius: 8px; }
    .top { display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; border-bottom: 2px solid #1c1c1a; padding-bottom: 16px; }
    h1 { margin: 0; font-size: 1.6rem; letter-spacing: .04em; }
    h2 { margin: 0 0 4px; font-size: 1.1rem; }
    .meta { text-align: right; font-size: .9rem; }
    .parties { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 20px 0; font-size: .9rem; }
    .label { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: #6b6b66; margin-bottom: 4px; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th, td { padding: 9px 6px; border-bottom: 1px solid #e4e4df; text-align: left; }
    th { background: #f7f7f5; font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; }
    .num { text-align: right; white-space: nowrap; }
    .sum { margin-left: auto; width: 320px; max-width: 100%; margin-top: 14px; font-size: .92rem; }
    .sum div { display: flex; justify-content: space-between; padding: 4px 0; }
    .sum .grand { font-weight: 700; font-size: 1.05rem; border-top: 2px solid #1c1c1a; margin-top: 6px; padding-top: 8px; }
    .foot { margin-top: 28px; font-size: .8rem; color: #6b6b66; border-top: 1px solid #e4e4df; padding-top: 12px; }
    .paid { display: inline-block; border: 2px solid #15803d; color: #15803d; font-weight: 700; padding: 2px 10px; border-radius: 4px; margin-top: 6px; }
    .toolbar { max-width: 800px; margin: 0 auto 14px; display: flex; gap: 10px; justify-content: flex-end; }
    .toolbar button, .toolbar a { background: #1f4fd8; color: #fff; border: 0; padding: 9px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; text-decoration: none; font-size: .9rem; }
    .toolbar a { background: #fff; color: #1f4fd8; border: 1px solid #1f4fd8; }
    .err { max-width: 800px; margin: 0 auto; background: #fdecec; color: #b91c1c; padding: 14px; border-radius: 8px; }
    @media (max-width: 600px) { .sheet { padding: 20px; } .parties { grid-template-columns: 1fr; } .meta { text-align: left; } }
    @media print { body { background: #fff; padding: 0; } .sheet { border: 0; padding: 0; } .toolbar { display: none; } }
  </style>
</head>
<body>
  <div class="toolbar"><a href="javascript:history.back()">Back</a><button onclick="window.print()">Download PDF / Print</button></div>
  <div id="out"></div>

  <script src="/assets/app.js"></script>
  <script>
    (async () => {
      const out = document.getElementById("out");
      const id = App.qs("id"), email = App.qs("email");
      const [r, store] = await Promise.all([
        fetch(`/api/order?id=${encodeURIComponent(id || "")}&email=${encodeURIComponent(email || "")}`),
        App.loadStore(),
      ]);
      const o = await r.json();
      if (!r.ok || !o.invoice) {
        out.innerHTML = `<div class="err">${App.esc(o.error || "Invoice is available once payment is confirmed.")}</div>`;
        return;
      }
      document.title = `Invoice ${o.invoice.number}`;
      const s = store.seller, c = o.customer, p = (v) => App.inrPaise(v);
      const intra = c.state === s.state;
      const ratePct = Math.round(store.gstRate * 100);
      const taxRows = intra
        ? `<div><span>CGST (${ratePct / 2}%)</span><span>${p(Math.floor(o.gst / 2))}</span></div>
           <div><span>SGST (${ratePct / 2}%)</span><span>${p(o.gst - Math.floor(o.gst / 2))}</span></div>`
        : `<div><span>IGST (${ratePct}%)</span><span>${p(o.gst)}</span></div>`;

      out.innerHTML = `
      <div class="sheet">
        <div class="top">
          <div>
            <h2>${App.esc(store.name)}</h2>
            <div style="font-size:.88rem">${App.esc(s.legalName)}<br>${App.esc(s.address)}, ${App.esc(s.city)}<br>${App.esc(s.state)} ${App.esc(s.pincode)}<br>GSTIN: ${App.esc(s.gstin)}<br>${App.esc(s.email)} · ${App.esc(s.phone)}</div>
          </div>
          <div class="meta">
            <h1>TAX INVOICE</h1>
            <div>Invoice no: <strong>${App.esc(o.invoice.number)}</strong></div>
            <div>Invoice date: ${new Date(o.invoice.date).toLocaleDateString("en-IN", { dateStyle: "medium" })}</div>
            <div>Order ID: ${App.esc(o.id)}</div>
            <div class="paid">PAID</div>
          </div>
        </div>

        <div class="parties">
          <div><div class="label">Bill to / Ship to</div>
            <strong>${App.esc(c.name)}</strong><br>${App.esc(c.address)}<br>${App.esc(c.city)}, ${App.esc(c.state)} ${App.esc(c.pincode)}<br>${App.esc(c.email)} · ${App.esc(c.phone)}</div>
          <div><div class="label">Payment</div>
            Method: ${o.payment.mode === "demo" ? "Simulated (demo mode)" : "Razorpay (test mode)"}<br>
            Payment ID: ${App.esc(o.payment.paymentId || "—")}<br>
            Paid on: ${o.payment.paidAt ? App.fmtDate(o.payment.paidAt) : "—"}<br>
            Place of supply: ${App.esc(c.state)}</div>
        </div>

        <table>
          <thead><tr><th>#</th><th>Item</th><th class="num">Unit price</th><th class="num">Qty</th><th class="num">Amount</th></tr></thead>
          <tbody>
            ${o.items.map((l, i) => `<tr><td>${i + 1}</td><td>${App.esc(l.name)}</td><td class="num">${p(l.price)}</td><td class="num">${l.qty}</td><td class="num">${p(l.lineTotal)}</td></tr>`).join("")}
          </tbody>
        </table>

        <div class="sum">
          <div><span>Taxable value</span><span>${p(o.subtotal)}</span></div>
          ${taxRows}
          <div><span>Shipping</span><span>${o.shipping ? p(o.shipping) : "Free"}</span></div>
          <div class="grand"><span>Total</span><span>${p(o.total)}</span></div>
        </div>

        <div class="foot">This is a computer-generated invoice for a TEST store. No real goods or tax liability are involved.</div>
      </div>`;
    })();
  </script>
</body>
</html>
